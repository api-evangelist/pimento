  detail: >-
    Pimento's only API is the first-party backend behind its own web app —
    https://app.pimento.design/api/* answers 401 {"detail":"Unable to authenticate"}
    to anonymous callers and is guarded by the Auth0 tenant gopimento.eu.auth0.com
    with audience https://api.gopimento.co (a name that does not resolve in public
    DNS) — and Pimento publishes no developer portal, reference, spec, or SDK for it
    anywhere; docs.pimento.design and api.pimento.design do not exist, and every
    /openapi.json, /llms.txt and /.well-known/* path on www and app answers 200 with
    the identical single-page-app shell rather than a document.
