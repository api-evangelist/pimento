name: Pimento
description: 'Pimento is an AI ad-creative platform that helps marketing and advertising
  teams generate, analyze, and benchmark advertising creatives at scale. Its published
  product surface spans creative generation (Create), performance analysis (Analyze),
  competitive benchmarking (Benchmark), reusable brand kits, a Meta Score for predicting
  ad performance, multiformat output, and Meta Advantage+ support. Pimento is a venture-backed
  company in Partech''s portfolio. It ships an end-user SaaS application at app.pimento.design
  backed by a private REST API and an Auth0 tenant, but that API is first-party only:
  it is undocumented, returns 401 to anonymous callers, and is not offered to developers.
  No developer portal, API reference, OpenAPI or other machine-readable specification,
  SDK, package, webhook catalog, CLI, changelog, status page, public pricing page, or
  MCP/A2A agent surface is published anywhere on a Pimento-controlled host.'
