note: >-
  No published rate limits. Pimento has no developer documentation of any kind, so
  there is no page on which a limit could be documented: the help centre
  (help.pimento.design, Intercom-hosted) exposes exactly one article — "Contact us!" —
  and its llms.txt confirms that is the whole public index. Pimento's own API is the
  private application backend at https://app.pimento.design/api/*, which answers 401
  to anonymous callers and therefore emits no observable RateLimit-* / X-RateLimit-* /
  Retry-After headers to record. The product is metered by CREDITS rather than by
  request rate — the application links a "How additional credits work" article — but
  that article returns 404 and no allowance, reset window, or overage figure is
  published. An honest zero: nothing was found because nothing is published.
